    // Helper para obtener iniciales
    function getInitials(name) {
      if (!name || name === "A designar") return "PN";
      const parts = name.trim().split(" ");
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return name.substring(0, 2).toUpperCase();
    }

    // Generar tarjeta HTML

      const initials = getInitials(item.referente);

      return `

          <div>
            <!-- Título de Programa -->
            <h3 class="font-bold text-slate-900 text-base leading-snug mb-4">
              ${item.nombre}
            </h3>

            <!-- Referente -->
            <div class="flex items-center gap-3 pt-3 border-t border-slate-100">
              <div class="w-10 h-10 rounded-full ${hasEmail ? 'bg-gradient-to-tr from-inta-navy to-inta-blue text-white' : 'bg-slate-200 text-slate-500'} flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-sm">
                ${initials}
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-slate-800 truncate" title="${item.referente}">
                  ${item.referente}
                </p>
              </div>
            </div>
          </div>

          <!-- Acciones de contacto -->
          <div class="mt-4 pt-3 border-t border-slate-100">
            ${hasEmail ? `
              <div class="flex items-center gap-1.5">
                <a href="mailto:${item.email}?subject=Consulta Programa Nacional INTA - ${encodeURIComponent(item.nombre)}"
                   class="flex-1 inline-flex items-center justify-center gap-1.5 bg-inta-blue hover:bg-inta-navy text-white text-xs font-medium py-2 px-3 rounded-lg transition-colors group">
                  <svg class="w-3.5 h-3.5 text-blue-200 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                  </svg>
                  <span class="truncate">Contactar</span>
                </a>
                <button 
                  onclick="copyToClipboard('${item.email}')" 
                  title="Copiar correo: ${item.email}"
                  class="p-2 text-slate-500 hover:text-inta-blue hover:bg-inta-light rounded-lg border border-slate-200 transition-colors"
                  aria-label="Copiar correo">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                </button>
              </div>
              <p class="text-[11px] text-slate-400 mt-1.5 truncate select-all font-mono" title="${item.email}">

              </p>
            ` : `

    // Renderizado directo de las tarjetas
    function renderCards() {
      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = programasData.map(item => createCard(item)).join('');
    }

    // Copiar al portapapeles (compatible con iFrame y SharePoint)
    function copyToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.select();
      
      try {
        document.execCommand('copy');
        showToast();
      } catch (err) {
        console.error('Error al copiar', err);
      }
      document.body.removeChild(textArea);
    }

    // Feedback visual toast
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Inicializar renderizado
    window.onload = function() {
      renderCards();
    };
