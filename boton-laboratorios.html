<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botón Red de Laboratorios INTA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      height: 300px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .inta-pn-card-wrapper {
      width: 300px;
      height: 300px;
      display: block;
      text-decoration: none;
    }

    .inta-pn-button {
      position: relative;
      width: 100%;
      height: 100%;
      margin-top: 10px;
      border-radius: 18px;
      background: linear-gradient(155deg, #1b2636 0%, #0d1522 100%);
      border: 2px solid #2e3e55;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                  border-color 0.35s ease,
                  box-shadow 0.35s ease,
                  background 0.35s ease;
    }

    .inta-pn-button::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 122, 255, 0.15) 0%, rgba(0, 80, 180, 0.05) 45%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.85);
    }

    .inta-pn-icon-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .inta-pn-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Anillo perimetral orbital */
    .inta-pn-svg-ring {
      stroke: #33445c;
      stroke-width: 2;
      stroke-dasharray: 5 4;
      fill: none;
      transition: stroke 0.35s ease, stroke-width 0.35s ease;
    }

    /* Líneas de enlace de la red */
    .inta-pn-svg-tracks {
      stroke: #364761;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.35s ease;
    }

    /* Cuerpo del matraz de laboratorio central */
    .inta-pn-svg-base {
      fill: #141e2e;
      stroke: #415573;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill 0.35s ease, stroke 0.35s ease, filter 0.35s ease;
    }

    /* Cuello y nivel reactivo del matraz */
    .inta-pn-svg-core {
      fill: #223249;
      stroke: #415573;
      stroke-width: 1.8;
      transition: fill 0.35s ease, stroke 0.35s ease;
    }

    /* Nodos satélite de laboratorios interconectados */
    .inta-pn-svg-nodes {
      fill: #607594;
      transition: fill 0.35s ease, transform 0.35s ease;
    }

    /* Nodo activo en red (acento rojo sutil) */
    .inta-pn-svg-accent {
      fill: #7d2a32;
      transition: fill 0.35s ease, filter 0.35s ease;
    }

    .inta-pn-text-group {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .inta-pn-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #c9d6e6;
      line-height: 1.25;
      letter-spacing: 0.3px;
      transition: color 0.35s ease;
    }

    .inta-pn-status-bar {
      width: 38px;
      height: 3px;
      border-radius: 2px;
      background-color: #2b394e;
      transition: all 0.35s ease;
    }

    /* Estado activo / Hover */
    .inta-pn-card-wrapper:hover .inta-pn-button {
      transform: translateY(-4px) scale(1.01);
      border-color: #0078d4;
      background: linear-gradient(155deg, #1e3047 0%, #101c2e 100%);
      box-shadow: 0 10px 28px rgba(0, 120, 212, 0.28), 0 0 15px rgba(0, 120, 212, 0.2);
    }

    .inta-pn-card-wrapper:hover .inta-pn-button::before {
      opacity: 1;
      transform: scale(1.15);
    }

    .inta-pn-card-wrapper:hover .inta-pn-icon-container {
      transform: scale(1.08);
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-ring {
      stroke: #0078d4;
      stroke-width: 2.2;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-tracks {
      stroke: #5ba3e0;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-base {
      fill: #183354;
      stroke: #0098ff;
      filter: drop-shadow(0 0 6px rgba(0, 152, 255, 0.6));
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-core {
      fill: #264366;
      stroke: #0098ff;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-nodes {
      fill: #e1ecfa;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-accent {
      fill: #d82b38;
      filter: drop-shadow(0 0 5px rgba(216, 43, 56, 0.85));
    }

    .inta-pn-card-wrapper:hover .inta-pn-title {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .inta-pn-card-wrapper:hover .inta-pn-status-bar {
      width: 55px;
      background-color: #0098ff;
      box-shadow: 0 0 10px #0098ff;
    }
  </style>
</head>
<body>
  <!-- Reemplazá el href por la URL de destino de la Red de Laboratorios -->
  <a href="https://intaarg.sharepoint.com/sites/DNAID/SitePages/Red%20de%20Laboartorios.aspx" target="_blank" rel="noopener noreferrer" class="inta-pn-card-wrapper" title="Ingresar a Red de Laboratorios">
    <div class="inta-pn-button">
      <div class="inta-pn-icon-container">
        <svg class="inta-pn-svg" viewBox="0 0 100 100">
          <!-- Anillo exterior de órbita y alcance -->
          <circle class="inta-pn-svg-ring" cx="50" cy="50" r="43" />

          <!-- Vínculos reticulares de conexión entre laboratorios -->
          <line class="inta-pn-svg-tracks" x1="22" y1="36" x2="43" y2="40" />
          <line class="inta-pn-svg-tracks" x1="50" y1="20" x2="50" y2="30" />
          <line class="inta-pn-svg-tracks" x1="78" y1="32" x2="57" y2="40" />
          <line class="inta-pn-svg-tracks" x1="82" y1="62" x2="65" y2="62" />
          <line class="inta-pn-svg-tracks" x1="68" y1="80" x2="55" y2="72" />
          <line class="inta-pn-svg-tracks" x1="32" y1="80" x2="45" y2="72" />
          <line class="inta-pn-svg-tracks" x1="18" y1="62" x2="35" y2="62" />

          <!-- Conexiones inter-nodales perimétricas -->
          <line class="inta-pn-svg-tracks" x1="22" y1="36" x2="18" y2="62" stroke-dasharray="3 3" />
          <line class="inta-pn-svg-tracks" x1="78" y1="32" x2="82" y2="62" stroke-dasharray="3 3" />

          <!-- Matraz Erlenmeyer central (Símbolo de laboratorio) -->
          <path class="inta-pn-svg-base" d="M46 32 L46 45 L36 67 C34 71 37 74 41 74 L59 74 C63 74 66 71 64 67 L54 45 L54 32 Z" />
          
          <!-- Cuello y boca del matraz -->
          <rect class="inta-pn-svg-core" x="43" y="28" width="14" height="4" rx="2" />
          
          <!-- Líquido reactivo analítico interno -->
          <path class="inta-pn-svg-core" d="M39 63 C43 65 47 61 51 63 C55 65 59 62 61 63 L63 67 C63 70 61 72 58 72 L42 72 C39 72 37 70 37 67 Z" />

          <!-- Burbuja reactiva interna -->
          <circle class="inta-pn-svg-nodes" cx="49" cy="53" r="2" />

          <!-- Nodos periféricos de la red -->
          <circle class="inta-pn-svg-nodes" cx="50" cy="18" r="3.5" />
          <circle class="inta-pn-svg-nodes" cx="22" cy="36" r="3.5" />
          <circle class="inta-pn-svg-nodes" cx="18" cy="62" r="3.5" />
          <circle class="inta-pn-svg-nodes" cx="32" cy="80" r="3.5" />
          <circle class="inta-pn-svg-nodes" cx="68" cy="80" r="3.5" />
          <circle class="inta-pn-svg-nodes" cx="82" cy="62" r="3.5" />

          <!-- Nodo destacado en red (Acento rojo institucional) -->
          <circle class="inta-pn-svg-accent" cx="78" cy="32" r="4.5" />
        </svg>
      </div>
      <div class="inta-pn-text-group">
        <h3 class="inta-pn-title">Red de<br>Laboratorios</h3>
      </div>
      <div class="inta-pn-status-bar"></div>
    </div>
  </a>
</body>
</html>
