<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botón Más recursos I+D INTA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      height: 300px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .inta-pn-card-wrapper {
      width: 300px;
      height: 300px;
      display: block;
      text-decoration: none;
    }

    .inta-pn-button {
      position: relative;
      width: 100%;
      height: 100%;
      margin-top: 10px;
      border-radius: 18px;
      background: linear-gradient(155deg, #1b2636 0%, #0d1522 100%);
      border: 2px solid #2e3e55;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                  border-color 0.35s ease,
                  box-shadow 0.35s ease,
                  background 0.35s ease;
    }

    .inta-pn-button::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 122, 255, 0.15) 0%, rgba(0, 80, 180, 0.05) 45%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.85);
    }

    .inta-pn-icon-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .inta-pn-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Anillo perimetral orbital */
    .inta-pn-svg-ring {
      stroke: #33445c;
      stroke-width: 2;
      stroke-dasharray: 5 4;
      fill: none;
      transition: stroke 0.35s ease, stroke-width 0.35s ease;
    }

    /* Vectores de expansión y conectores de recursos */
    .inta-pn-svg-tracks {
      stroke: #364761;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.35s ease;
    }

    /* Plataforma de catálogo / Libro y capas de información */
    .inta-pn-svg-base {
      fill: #141e2e;
      stroke: #415573;
      stroke-width: 2.2;
      stroke-linejoin: round;
      transition: fill 0.35s ease, stroke 0.35s ease, filter 0.35s ease;
    }

    /* Núcleo de generación de conocimiento / Hoja central */
    .inta-pn-svg-core {
      fill: #223249;
      stroke: #415573;
      stroke-width: 1.8;
      transition: fill 0.35s ease, stroke 0.35s ease;
    }

    /* Nodos satélite de repositorios y bases de datos */
    .inta-pn-svg-nodes {
      fill: #607594;
      transition: fill 0.35s ease, transform 0.35s ease;
    }

    /* Hito / Acento rojo de innovación */
    .inta-pn-svg-accent {
      fill: #7d2a32;
      transition: fill 0.35s ease, filter 0.35s ease;
    }

    .inta-pn-text-group {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .inta-pn-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #c9d6e6;
      line-height: 1.25;
      letter-spacing: 0.3px;
      transition: color 0.35s ease;
    }

    .inta-pn-status-bar {
      width: 38px;
      height: 3px;
      border-radius: 2px;
      background-color: #2b394e;
      transition: all 0.35s ease;
    }

    /* Estado activo / Hover */
    .inta-pn-card-wrapper:hover .inta-pn-button {
      transform: translateY(-4px) scale(1.01);
      border-color: #0078d4;
      background: linear-gradient(155deg, #1e3047 0%, #101c2e 100%);
      box-shadow: 0 10px 28px rgba(0, 120, 212, 0.28), 0 0 15px rgba(0, 120, 212, 0.2);
    }

    .inta-pn-card-wrapper:hover .inta-pn-button::before {
      opacity: 1;
      transform: scale(1.15);
    }

    .inta-pn-card-wrapper:hover .inta-pn-icon-container {
      transform: scale(1.08);
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-ring {
      stroke: #0078d4;
      stroke-width: 2.2;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-tracks {
      stroke: #5ba3e0;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-base {
      fill: #183354;
      stroke: #0098ff;
      filter: drop-shadow(0 0 6px rgba(0, 152, 255, 0.6));
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-core {
      fill: #264366;
      stroke: #0098ff;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-nodes {
      fill: #e1ecfa;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-accent {
      fill: #d82b38;
      filter: drop-shadow(0 0 5px rgba(216, 43, 56, 0.85));
    }

    .inta-pn-card-wrapper:hover .inta-pn-title {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .inta-pn-card-wrapper:hover .inta-pn-status-bar {
      width: 55px;
      background-color: #0098ff;
      box-shadow: 0 0 10px #0098ff;
    }
  </style>
</head>
<body>
  <!-- Reemplazá el href por la URL de destino de Más recursos I+D -->
  <a href="https://intaarg.sharepoint.com/sites/DNAID/Material%20compartido/Forms/AllItems.aspx?viewid=679ac8f9%2D96c5%2D4916%2Dbe9e%2Df724d6196d38" target="_blank" rel="noopener noreferrer" class="inta-pn-card-wrapper" title="Ingresar a Más recursos I+D">
    <div class="inta-pn-button">
      <div class="inta-pn-icon-container">
        <svg class="inta-pn-svg" viewBox="0 0 100 100">
          <!-- Anillo exterior técnico -->
          <circle class="inta-pn-svg-ring" cx="50" cy="50" r="44" />

          <!-- Líneas de difusión y vectores de conocimiento emergente -->
          <line class="inta-pn-svg-tracks" x1="50" y1="46" x2="50" y2="24" />
          <line class="inta-pn-svg-tracks" x1="50" y1="46" x2="30" y2="30" />
          <line class="inta-pn-svg-tracks" x1="50" y1="46" x2="70" y2="30" />
          <line class="inta-pn-svg-tracks" x1="30" y1="30" x2="50" y2="24" stroke-dasharray="3 3" />
          <line class="inta-pn-svg-tracks" x1="70" y1="30" x2="50" y2="24" stroke-dasharray="3 3" />

          <!-- Capa inferior de recursos / Documentos de base -->
          <path class="inta-pn-svg-core" d="M26 68 L50 75 L74 68 L74 74 L50 81 L26 74 Z" />

          <!-- Capa principal abierta / Catálogo y biblioteca de I+D -->
          <path class="inta-pn-svg-base" d="M50 52 L76 60 L76 68 L50 61 L24 68 L24 60 Z" />
          
          <!-- Hojas / Bloques centrales de contenido -->
          <path class="inta-pn-svg-core" d="M50 52 L50 61" />
          <line class="inta-pn-svg-tracks" x1="32" y1="60" x2="44" y2="57" />
          <line class="inta-pn-svg-tracks" x1="56" y1="57" x2="68" y2="60" />

          <!-- Núcleo central de I+D (Chispa / Innovación) -->
          <circle class="inta-pn-svg-core" cx="50" cy="46" r="6" />

          <!-- Nodos periféricos de recursos y plataformas -->
          <circle class="inta-pn-svg-nodes" cx="50" cy="24" r="4" />
          <circle class="inta-pn-svg-nodes" cx="30" cy="30" r="3.5" />
          <circle class="inta-pn-svg-nodes" cx="20" cy="48" r="3" />
          <circle class="inta-pn-svg-nodes" cx="80" cy="48" r="3" />

          <!-- Hito destacado de I+D (Acento rojo institucional) -->
          <circle class="inta-pn-svg-accent" cx="70" cy="30" r="4.5" />
        </svg>
      </div>
      <div class="inta-pn-text-group">
        <h3 class="inta-pn-title">Más recursos<br>I+D</h3>
      </div>
      <div class="inta-pn-status-bar"></div>
    </div>
  </a>
</body>
</html>
