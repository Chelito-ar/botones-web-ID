<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botón Más recursos I+D INTA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      height: 300px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .inta-pn-card-wrapper {
      width: 300px;
      height: 300px;
      display: block;
      text-decoration: none;
    }

    .inta-pn-button {
      position: relative;
      width: 100%;
      height: 100%;
      margin-top: 10px;
      border-radius: 18px;
      background: linear-gradient(155deg, #1b2636 0%, #0d1522 100%);
      border: 2px solid #2e3e55;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                  border-color 0.35s ease,
                  box-shadow 0.35s ease,
                  background 0.35s ease;
    }

    .inta-pn-button::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 122, 255, 0.15) 0%, rgba(0, 80, 180, 0.05) 45%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.85);
    }

    .inta-pn-icon-container {
      position: relative;
      width: 110px;
      height: 110px;
