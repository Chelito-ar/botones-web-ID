<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botón Programas Nacionales INTA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      height: 300px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    .inta-pn-card-wrapper {
      width: 300px;
      height: 300px;
      display: block;
      text-decoration: none;
    }

    .inta-pn-button {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      background: linear-gradient(155deg, #1b2636 0%, #0d1522 100%);
      border: 2px solid #2e3e55;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                  border-color 0.35s ease,
                  box-shadow 0.35s ease,
                  background 0.35s ease;
    }

    .inta-pn-button::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 122, 255, 0.15) 0%, rgba(0, 80, 180, 0.05) 45%, transparent 70%);
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: scale(0.85);
    }

    .inta-pn-icon-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .inta-pn-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .inta-pn-svg-ring {
      stroke: #33445c;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.35s ease, stroke-width 0.35s ease;
    }

    .inta-pn-svg-base {
      fill: #141e2e;
      stroke: #415573;
      stroke-width: 2.5;
      transition: fill 0.35s ease, stroke 0.35s ease, filter 0.35s ease;
    }

    .inta-pn-svg-nodes {
      fill: #607594;
      transition: fill 0.35s ease;
    }

    .inta-pn-svg-tracks {
      stroke: #364761;
      stroke-width: 2;
      stroke-dasharray: 4 3;
      fill: none;
      transition: stroke 0.35s ease;
    }

    .inta-pn-svg-core {
      fill: #506785;
      transition: fill 0.35s ease;
    }

    .inta-pn-svg-accent {
      fill: #7d2a32;
      transition: fill 0.35s ease;
    }

    .inta-pn-text-group {
      position: relative;
      text-align: center;
      z-index: 1;
    }

    .inta-pn-badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 1.8px;
      font-weight: 700;
      text-transform: uppercase;
      color: #8da4c4;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid #2e3e55;
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 6px;
      transition: all 0.35s ease;
    }

    .inta-pn-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: #c9d6e6;
      line-height: 1.25;
      letter-spacing: 0.3px;
      transition: color 0.35s ease;
    }

    .inta-pn-status-bar {
      width: 38px;
      height: 3px;
      border-radius: 2px;
      background-color: #2b394e;
      transition: all 0.35s ease;
    }

    /* Estado activo / Hover */
    .inta-pn-card-wrapper:hover .inta-pn-button {
      transform: translateY(-4px) scale(1.01);
      border-color: #0078d4;
      background: linear-gradient(155deg, #1e3047 0%, #101c2e 100%);
      box-shadow: 0 10px 28px rgba(0, 120, 212, 0.28), 0 0 15px rgba(0, 120, 212, 0.2);
    }

    .inta-pn-card-wrapper:hover .inta-pn-button::before {
      opacity: 1;
      transform: scale(1.15);
    }

    .inta-pn-card-wrapper:hover .inta-pn-icon-container {
      transform: scale(1.08);
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-ring {
      stroke: #0078d4;
      stroke-width: 2.5;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-tracks {
      stroke: #5ba3e0;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-base {
      fill: #183354;
      stroke: #0098ff;
      filter: drop-shadow(0 0 6px rgba(0, 152, 255, 0.6));
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-core {
      fill: #ffffff;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-nodes {
      fill: #e1ecfa;
    }

    .inta-pn-card-wrapper:hover .inta-pn-svg-accent {
      fill: #d82b38;
      filter: drop-shadow(0 0 4px rgba(216, 43, 56, 0.8));
    }

    .inta-pn-card-wrapper:hover .inta-pn-badge {
      color: #ffffff;
      border-color: #0078d4;
      background-color: rgba(0, 120, 212, 0.25);
    }

    .inta-pn-card-wrapper:hover .inta-pn-title {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .inta-pn-card-wrapper:hover .inta-pn-status-bar {
      width: 55px;
      background-color: #0098ff;
      box-shadow: 0 0 10px #0098ff;
    }
  </style>
</head>
<body>
  <a href="https://intaarg.sharepoint.com/sites/DNAID/SitePages/Programas-Nacionales-INTA.aspx" target="_blank" rel="noopener noreferrer" class="inta-pn-card-wrapper" title="Ingresar a Programas Nacionales del INTA">
    <div class="inta-pn-button">
      <div class="inta-pn-icon-container">
        <svg class="inta-pn-svg" viewBox="0 0 100 100">
          <circle class="inta-pn-svg-ring" cx="50" cy="50" r="44" />
          <line class="inta-pn-svg-tracks" x1="50" y1="20" x2="50" y2="80" />
          <line class="inta-pn-svg-tracks" x1="22" y1="50" x2="78" y2="50" />
          <line class="inta-pn-svg-tracks" x1="30" y1="30" x2="70" y2="70" />
          <line class="inta-pn-svg-tracks" x1="30" y1="70" x2="70" y2="30" />
          <circle class="inta-pn-svg-base" cx="50" cy="50" r="23" />
          <circle class="inta-pn-svg-core" cx="50" cy="50" r="10" />
          <circle class="inta-pn-svg-nodes" cx="50" cy="18" r="4" />
          <circle class="inta-pn-svg-nodes" cx="80" cy="50" r="4" />
          <circle class="inta-pn-svg-nodes" cx="50" cy="82" r="4" />
          <circle class="inta-pn-svg-nodes" cx="20" cy="50" r="4" />
          <circle class="inta-pn-svg-accent" cx="71" cy="29" r="4.5" />
        </svg>
      </div>
      <div class="inta-pn-text-group">
        <span class="inta-pn-badge">INTA</span>
        <h3 class="inta-pn-title">Programas<br>Nacionales</h3>
      </div>
      <div class="inta-pn-status-bar"></div>
    </div>
  </a>
</body>
</html>
